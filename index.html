<style>
:root{
  --bg:#EEE8FB; --ink:#2A2350; --muted:#4B4378; --panel:#FFFFFF; --clue:#FFE3EC;
  --accent:#6A4CF0; --accent-2:#8B72FF; --ok:#A8E6C9; --ok-ink:#16392A; --okcell:#C8F0DC;
  --cur:#FFE59A; --hero:#D9CCFF; --bad:#FFD3D3; --tip:#FFF4D1;
  --r:26px;
  --sh:inset -6px -6px 12px rgba(80,60,160,.12),inset 6px 6px 12px rgba(255,255,255,.9),10px 14px 24px rgba(80,60,160,.18);
  --bsh:inset -4px -5px 10px rgba(30,10,110,.35),inset 4px 4px 8px rgba(255,255,255,.35),6px 10px 18px rgba(80,60,160,.3);
  --tsh:inset -3px -3px 6px rgba(80,60,160,.15),inset 3px 3px 6px rgba(255,255,255,.9),4px 6px 12px rgba(80,60,160,.2);
  --fd:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --fb:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:clamp(16px,4.4vw,18px);line-height:1.65;min-height:100vh;min-height:100dvh;word-break:keep-all;overflow-wrap:anywhere;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;touch-action:manipulation}
img{-webkit-user-drag:none;user-select:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid #2F7CF6;outline-offset:3px}
.disp{font-family:var(--fd);font-weight:400;line-height:1.25;margin:0}
.ln{display:block;text-wrap:pretty}
.ln+.ln{margin-top:.7em}
.ph{display:inline-block}
h1,h2,h3,.bubble,.badh{text-wrap:balance}
.chip{align-self:flex-start;display:inline-flex;font-size:clamp(13px,3.6vw,15px);font-weight:700;padding:5px 12px;border-radius:999px;background:var(--accent);color:#fff}
.cta{width:100%;min-height:60px;border:0;border-radius:var(--r);background:linear-gradient(180deg,var(--accent-2),var(--accent));color:#fff;box-shadow:var(--bsh);font-family:var(--fd);font-size:clamp(20px,5.5vw,23px);cursor:pointer;transition:transform .08s}
.cta:active{transform:translate(1px,3px)}
.ghost{min-height:48px;padding:0 18px;border:2px solid var(--ink);border-radius:999px;background:transparent;font-weight:600;font-size:clamp(15px,4.2vw,17px);cursor:pointer}
.ghost:hover{background:rgba(255,255,255,.6)}
.bubble{margin:0;background:var(--panel);padding:12px 16px;border-radius:18px;font-weight:700;font-size:clamp(15px,4.2vw,18px);line-height:1.5;position:relative;box-shadow:0 4px 12px rgba(80,60,160,.15)}

/* ================= 마스코트 ================= */
.mc{position:relative;width:var(--w,120px);flex:0 0 auto}
.mc .mcw{position:relative;width:100%;aspect-ratio:321/400;transform-origin:50% 100%}
.mc .mcw img{position:absolute;inset:0;width:100%;height:100%;display:block}
.mc .hd{transform-origin:50% 68%}
.mc .shadow{position:absolute;left:20%;right:20%;bottom:-3%;height:7%;border-radius:50%;background:rgba(60,40,140,.2)}
.mc .fx{position:absolute;inset:-20% -30% 10%;pointer-events:none;z-index:0}
.mc .mcw{z-index:1}
.mc .fx.front{z-index:2}
.p{position:absolute;left:50%;top:45%;font-size:calc(var(--w,120px) * .16);line-height:1;opacity:0;font-family:Arial,sans-serif;font-weight:700}
.p.cf{width:calc(var(--w,120px) * .06);height:calc(var(--w,120px) * .1);border-radius:2px}
.p.heart{color:#FF6F9C}.p.star{color:#FFC531}.p.spark{color:#8B72FF}.p.note{color:#6A4CF0}
.rays{position:absolute;left:50%;top:42%;width:150%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  background:repeating-conic-gradient(rgba(255,229,154,.9) 0 10deg,transparent 10deg 30deg);
  -webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%);opacity:0}
.sweat{position:absolute;right:14%;top:12%;width:14%;opacity:0}

/* 공통 루프: 앞 60% 동안 제스처, 나머지는 쉼 */
.g{--dur:2.6s}
.g .mcw,.g .hd,.g .shadow,.g .p,.g .rays,.g .sweat{animation-duration:var(--dur);animation-iteration-count:infinite;animation-timing-function:ease-in-out;animation-fill-mode:both}
.p{animation-name:burst;animation-delay:var(--dl,0s)}
@keyframes burst{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}12%{opacity:1}55%{opacity:1;transform:translate(calc(-50% + var(--x) * var(--w,120px) / 100),calc(-50% + var(--y) * var(--w,120px) / 100)) scale(1) rotate(var(--rt,0deg))}70%,100%{opacity:0;transform:translate(calc(-50% + var(--x) * var(--w,120px) / 100),calc(-50% + (var(--y) + 12) * var(--w,120px) / 100)) scale(.8) rotate(var(--rt,0deg))}}
.p.fall{animation-name:fall}
@keyframes fall{0%{opacity:0;transform:translate(calc(var(--x) * var(--w,120px) / 100),calc(var(--w,120px) * -.7)) rotate(0)}10%{opacity:1}65%{opacity:1}80%,100%{opacity:0;transform:translate(calc(var(--x) * var(--w,120px) / 130),calc(var(--w,120px) * .9)) rotate(var(--rt,300deg))}}

@keyframes sh-jump{0%,8%,36%,60%,100%{transform:scaleX(1);opacity:1}22%{transform:scaleX(.55);opacity:.45}}
@keyframes sh-hi{0%,10%,48%,60%,100%{transform:scaleX(1);opacity:1}28%{transform:scaleX(.45);opacity:.35}}
@keyframes rest{0%,100%{transform:none}}

/* 1 만세 점프 */
.g-jump .mcw{animation-name:jump}
.g-jump .shadow{animation-name:sh-jump}
.g-jump .hd{animation-name:hd-tiltR}
@keyframes jump{0%{transform:none}8%{transform:scale(1.1,.86)}22%{transform:translateY(-30%) scale(.94,1.07)}36%{transform:scale(1.1,.88)}46%{transform:translateY(-7%)}56%,100%{transform:none}}
@keyframes hd-tiltR{0%,8%{transform:none}22%{transform:rotate(5deg)}40%,100%{transform:none}}
/* 2 공중 회전 */
.g-spin .mcw{animation-name:spin}
.g-spin .shadow{animation-name:sh-hi}
@keyframes spin{0%{transform:none}10%{transform:scale(1.08,.9)}28%{transform:translateY(-22%) rotateY(180deg)}46%{transform:translateY(-22%) rotateY(360deg)}54%{transform:scale(1.06,.94) rotateY(360deg)}60%,100%{transform:rotateY(360deg)}}
/* 3 끄덕끄덕 */
.g-nod .hd{animation-name:nod}
.g-nod .mcw{animation-name:bob-small}
@keyframes nod{0%,100%{transform:none}10%,30%,50%{transform:translateY(4%) rotate(-2deg)}20%,40%{transform:translateY(-1%)}58%{transform:none}}
@keyframes bob-small{0%,60%,100%{transform:none}10%,30%,50%{transform:scale(1.03,.96)}20%,40%{transform:translateY(-3%)}}
/* 4 흔들흔들 춤 */
.g-dance .mcw{animation-name:dance}
.g-dance .hd{animation-name:dance-hd}
@keyframes dance{0%,60%,100%{transform:none}10%{transform:translateX(-7%) rotate(-9deg)}20%{transform:translateX(7%) rotate(9deg) translateY(-5%)}30%{transform:translateX(-7%) rotate(-9deg)}40%{transform:translateX(7%) rotate(9deg) translateY(-5%)}50%{transform:none}}
@keyframes dance-hd{0%,60%,100%{transform:none}10%,30%{transform:rotate(6deg)}20%,40%{transform:rotate(-6deg)}}
/* 5 통통 두 번 */
.g-bounce .mcw{animation-name:bounce2}
.g-bounce .shadow{animation-name:sh-b2}
@keyframes bounce2{0%,60%,100%{transform:none}6%{transform:scale(1.1,.88)}16%{transform:translateY(-17%) scale(.96,1.05)}26%{transform:scale(1.1,.88)}36%{transform:translateY(-17%) scale(.96,1.05)}46%{transform:scale(1.07,.92)}}
@keyframes sh-b2{0%,6%,26%,46%,60%,100%{transform:scaleX(1);opacity:1}16%,36%{transform:scaleX(.65);opacity:.5}}
/* 6 갸웃 하트 */
.g-heart .hd{animation-name:tilt-hold}
.g-heart .mcw{animation-name:lean}
@keyframes tilt-hold{0%,100%{transform:none}15%,50%{transform:rotate(-6deg)}62%{transform:none}}
@keyframes lean{0%,100%{transform:none}15%,50%{transform:rotate(4deg) scale(1.03)}62%{transform:none}}
/* 7 뿅 등장 */
.g-pop .mcw{animation-name:popin}
@keyframes popin{0%{transform:scale(.5);opacity:.3}14%{transform:scale(1.18);opacity:1}24%{transform:scale(.92)}34%{transform:scale(1.05)}44%,100%{transform:none}}
/* 8 수줍은 도리도리 */
.g-shy .hd{animation-name:shy}
.g-shy .mcw{animation-name:squish}
@keyframes shy{0%,62%,100%{transform:none}12%,36%{transform:rotate(-6deg)}24%,48%{transform:rotate(6deg)}}
@keyframes squish{0%,62%,100%{transform:none}12%,36%{transform:scale(1.04,.95)}24%,48%{transform:scale(.97,1.03)}}
/* 9 공중제비 */
.g-flip .mcw{animation-name:flip;transform-origin:50% 55%}
.g-flip .shadow{animation-name:sh-hi}
@keyframes flip{0%{transform:none}10%{transform:scale(1.08,.9)}30%{transform:translateY(-30%) rotate(180deg)}48%{transform:rotate(360deg)}54%{transform:scale(1.06,.94) rotate(360deg)}60%,100%{transform:rotate(360deg)}}
/* 10 신나서 부들부들 */
.g-shake .mcw{animation-name:jitter}
.g-shake .hd{animation-name:nod}
@keyframes jitter{0%,58%,100%{transform:none}6%,18%,30%,42%{transform:translateX(-4%) rotate(-3deg)}12%,24%,36%,48%{transform:translateX(4%) rotate(3deg)}}
/* 11 날아오르기 */
.g-fly .mcw{animation-name:fly}
.g-fly .shadow{animation-name:sh-fly}
.g-fly .hd{animation-name:hd-up}
@keyframes fly{0%,100%{transform:none}22%{transform:translateY(-24%) rotate(-12deg)}38%{transform:translateY(-29%) rotate(-12deg)}50%{transform:translateY(-24%) rotate(-10deg)}64%{transform:none}}
@keyframes sh-fly{0%,64%,100%{transform:scaleX(1);opacity:1}22%,50%{transform:scaleX(.5);opacity:.35}}
@keyframes hd-up{0%,64%,100%{transform:none}22%,50%{transform:rotate(-4deg)}}
/* 12 반짝 펀치 */
.g-star .mcw{animation-name:punch}
.g-star .rays{animation-name:rays}
@keyframes punch{0%,60%,100%{transform:none}12%{transform:scale(.9,1.08) translateY(-4%)}24%{transform:scale(1.16)}36%{transform:scale(.97)}46%{transform:scale(1.03)}}
@keyframes rays{0%{opacity:0;transform:translate(-50%,-50%) rotate(0) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) rotate(40deg) scale(1)}55%{opacity:.9;transform:translate(-50%,-50%) rotate(110deg) scale(1)}70%,100%{opacity:0;transform:translate(-50%,-50%) rotate(140deg) scale(1.1)}}
/* 13 피날레 높이뛰기 */
.g-finale .mcw{animation-name:finale}
.g-finale .shadow{animation-name:sh-hi}
.g-finale .hd{animation-name:hd-tiltR}
@keyframes finale{0%{transform:none}10%{transform:scale(1.12,.84)}28%{transform:translateY(-30%) rotate(-8deg) scale(.94,1.08)}40%{transform:translateY(-30%) rotate(8deg)}50%{transform:scale(1.1,.88)}58%,100%{transform:none}}
/* 오답: 도리도리 + 땀 */
.g-no .hd{animation-name:no}
.g-no .mcw{animation-name:slump}
.g-no .sweat{animation-name:sweat}
@keyframes no{0%,64%,100%{transform:none}10%,30%,50%{transform:rotate(-6deg)}20%,40%{transform:rotate(6deg)}}
@keyframes slump{0%,100%{transform:none}10%,56%{transform:scale(1.04,.95)}64%{transform:none}}
@keyframes sweat{0%{opacity:0;transform:translateY(-20%)}12%{opacity:1;transform:none}50%{opacity:1;transform:translateY(60%)}62%,100%{opacity:0;transform:translateY(80%)}}
/* 대기: 숨쉬기 */
.g-idle .mcw{animation-name:breathe;--dur:3.2s}
@keyframes breathe{0%,100%{transform:none}50%{transform:scale(1.025,.975)}}
.g-curious .hd{animation-name:curious}
.g-curious .mcw{animation-name:breathe}
@keyframes curious{0%,100%{transform:none}25%,45%{transform:rotate(6deg)}65%,85%{transform:rotate(-4deg)}}

/* 등장 */
.enter-l{animation:enter-l .9s cubic-bezier(.3,1.5,.5,1) both}
.enter-d{animation:enter-d .9s cubic-bezier(.3,1.4,.5,1) .25s both}
@keyframes enter-l{from{transform:translateX(-120%) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
@keyframes enter-d{from{transform:translateY(-140%);opacity:0}70%{transform:translateY(4%) scale(1.06,.92)}to{transform:none;opacity:1}}
.pop-late{animation:popb .45s cubic-bezier(.3,1.6,.5,1) 1.05s both}
@keyframes popb{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
@keyframes rise{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.rise{animation:rise .28s ease-out both}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(var(--r0,0deg))}50%{transform:translateY(-10px) rotate(calc(var(--r0,0deg) * -1))}}

/* ================= 시작 화면 ================= */
.center{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
  padding:calc(20px + var(--sat)) calc(16px + var(--sar)) calc(20px + var(--sab)) calc(16px + var(--sal))}
.hero{width:100%;max-width:480px;background:var(--hero);border-radius:var(--r);box-shadow:var(--sh);padding:clamp(20px,5vw,32px);
  display:grid;grid-template-columns:1fr;gap:16px;align-items:center}
.hero-text{display:flex;flex-direction:column;gap:14px;min-width:0}
.hero-text p{margin:0}
.big{font-size:clamp(42px,12.5vw,68px);letter-spacing:-.5px;line-height:1.15}
.lead{margin:0;font-size:clamp(17px,4.8vw,21px);font-weight:500;line-height:1.6}
.meta{font-size:clamp(14px,3.8vw,16px);text-align:center;color:var(--muted);margin:0}
.stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:6px}
.duo{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:clamp(4px,3vw,18px);width:100%}
.letters{position:absolute;inset:-6% -2% 18%;pointer-events:none}
.lt{position:absolute;width:clamp(30px,8vw,40px);aspect-ratio:1;border-radius:12px;background:#fff;box-shadow:var(--tsh);display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:clamp(15px,4vw,20px);animation:floaty 3.4s ease-in-out infinite;animation-delay:var(--d,0s)}
@media (min-width:760px){
  .big{font-size:clamp(56px,6.4vw,76px)}
  .hero{max-width:980px;grid-template-columns:1.05fr 1fr;gap:28px;padding:40px}
  .hero.result{grid-template-columns:1fr 1fr}
}

/* ================= 문제 화면 ================= */
.bar{position:sticky;top:0;z-index:3;background:rgba(247,243,255,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid rgba(0,0,0,.07);
  padding:calc(10px + var(--sat)) calc(16px + var(--sar)) 12px calc(16px + var(--sal))}
.bar-in{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.bar .t{display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:700;font-size:clamp(15px,4vw,17px)}
.bar .t .disp{font-size:clamp(20px,5.4vw,24px)}
.dots{display:flex;gap:3px}
.dot{flex:1;height:10px;border-radius:999px;background:rgba(80,60,160,.16);box-shadow:inset 1px 1px 3px rgba(0,0,0,.1)}
.dot.on{background:#5BC895}.dot.cur{background:#F5C542}
.play{max-width:1040px;margin:0 auto;padding:20px calc(16px + var(--sar)) calc(40px + var(--sab)) calc(16px + var(--sal));display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.colL{flex:999 1 420px;min-width:0;display:flex;flex-direction:column;gap:18px}
.colR{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:14px}
.clue{background:var(--clue);border-radius:var(--r);box-shadow:var(--sh);padding:clamp(16px,4vw,22px);display:flex;flex-direction:column;gap:10px}
.tag{align-self:flex-start;font-size:clamp(14px,3.8vw,16px);font-weight:700;padding:4px 12px;border-radius:999px;background:var(--ink);color:#fff}
.clue h2{margin:0;font-weight:700;font-size:clamp(19px,5.3vw,25px);line-height:1.55}
.slots{display:grid;grid-template-columns:repeat(var(--n),minmax(0,52px));gap:clamp(4px,1.5vw,8px);justify-content:center}
.slot{aspect-ratio:.88;border-radius:clamp(8px,2.5vw,14px);background:#fff;box-shadow:inset 2px 2px 6px rgba(80,60,160,.18);display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:clamp(17px,5.4vw,28px)}
.slot.on{background:var(--cur);animation:popb .2s ease-out}
.tiles{display:flex;flex-wrap:wrap;gap:clamp(8px,2.4vw,10px);justify-content:center}
.tile{min-width:clamp(46px,13vw,56px);min-height:clamp(46px,13vw,56px);padding:0 6px;border:0;border-radius:16px;background:#fff;box-shadow:var(--tsh);font-family:var(--fd);font-size:clamp(21px,6vw,26px);cursor:pointer;transition:transform .08s}
.tile:active:not([disabled]){transform:scale(.92)}
.tile[disabled]{background:var(--accent);color:#fff;box-shadow:none;cursor:default;opacity:.9}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.board{background:var(--panel);border-radius:var(--r);box-shadow:var(--sh);padding:clamp(12px,3.5vw,16px);display:flex;flex-direction:column;gap:10px}
.board h3{margin:0;font-size:clamp(16px,4.3vw,18px);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:2px;width:100%;max-width:520px;margin:0 auto}
.c{aspect-ratio:1/1;border-radius:3px;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:clamp(8px,2.5vw,14px);line-height:1}
.c.o{background:#fff;box-shadow:inset 0 0 0 1.5px #B9AEE8}
.c.d{background:var(--okcell);color:var(--ok-ink);box-shadow:inset 0 0 0 1.5px #6CC79B}
.c.k{background:var(--cur);box-shadow:inset 0 0 0 2px var(--ink)}
.legend{font-size:clamp(14px,3.8vw,15px);color:var(--muted)}
.tip{display:flex;align-items:center;gap:12px;background:var(--hero);border-radius:var(--r);padding:10px 14px}
.tip p{margin:0;font-weight:600;font-size:clamp(15px,4.2vw,17px)}
.list{background:var(--panel);border-radius:var(--r);box-shadow:var(--sh);padding:12px 16px}
.list summary{cursor:pointer;font-weight:700;font-size:clamp(15px,4.2vw,17px);min-height:36px;display:flex;align-items:center}
.list ol{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:clamp(15px,4vw,16px)}
.list li{display:flex;gap:8px;align-items:baseline}
.list li .st{flex:0 0 auto;font-size:13px;font-weight:700;border-radius:999px;padding:0 8px;background:#EEE8FB}
.list li.dn .st{background:var(--okcell);color:var(--ok-ink)}
.list li.cu .st{background:var(--cur)}

/* ================= 모달 / 해설 ================= */
.ov{position:fixed;inset:0;z-index:10;background:rgba(30,20,70,.5);display:flex;align-items:flex-end;justify-content:center;
  padding:calc(10px + var(--sat)) calc(10px + var(--sar)) calc(10px + var(--sab)) calc(10px + var(--sal));animation:fade .2s ease-out both}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (min-width:640px){.ov{align-items:center;padding:24px}}
.sheet{width:100%;max-width:520px;max-height:100%;display:flex;flex-direction:column;background:var(--panel);border-radius:var(--r);box-shadow:0 20px 50px rgba(30,20,70,.35);overflow:hidden;animation:sheet-up .35s cubic-bezier(.2,1.2,.4,1) both}
@keyframes sheet-up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;display:flex;flex-direction:column;gap:14px;padding:0 clamp(16px,4.5vw,22px) 16px}
.sheet-foot{padding:12px clamp(16px,4.5vw,22px) 16px;border-top:1px solid #EFEAFB;display:flex;flex-direction:column;gap:8px;background:#fff}
.okstage{position:relative;margin:0 calc(clamp(16px,4.5vw,22px) * -1);padding:48px clamp(16px,4.5vw,22px) 14px;
  background:radial-gradient(120% 90% at 20% 100%,#C8F0DC 0,transparent 60%),linear-gradient(160deg,#E4DBFF,#D9CCFF 55%,#CFF2E1);
  display:flex;align-items:flex-end;gap:clamp(10px,3vw,18px)}
.okstage .mc{--w:clamp(92px,26vw,124px)}
.okstage .say{display:flex;flex-direction:column;gap:8px;align-items:flex-start;padding-bottom:10px;min-width:0}
.okbadge{display:inline-flex;align-items:center;gap:6px;font-family:var(--fd);font-size:clamp(24px,6.6vw,30px);background:var(--ok);color:var(--ok-ink);padding:2px 14px 4px;border-radius:14px;box-shadow:var(--tsh)}
.okstage .bubble{border-radius:18px 18px 18px 4px}
.cnt{position:absolute;top:12px;right:14px;font-size:13px;font-weight:700;background:rgba(255,255,255,.75);border-radius:999px;padding:2px 10px}
.word{display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:4px}
.word .dirl{font-size:clamp(14px,3.8vw,15px);font-weight:700;color:var(--muted)}
.ans{display:grid;grid-template-columns:repeat(var(--n),minmax(0,48px));gap:clamp(4px,1.4vw,7px);justify-content:center;width:100%}
.ans span{aspect-ratio:1;border-radius:clamp(8px,2.4vw,13px);background:var(--okcell);color:var(--ok-ink);box-shadow:var(--tsh);display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:clamp(17px,5vw,26px);animation:tile-in .45s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(.25s + var(--i) * .07s)}
@keyframes tile-in{from{transform:translateY(-30%) scale(.4);opacity:0}to{transform:none;opacity:1}}
.termrow{display:flex;justify-content:center}
.term{font-size:clamp(14px,3.8vw,16px);font-weight:700;background:#F1ECFF;color:var(--accent);border-radius:999px;padding:4px 12px;text-align:center}
.info{border-radius:20px;padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.info .hdr{display:flex;align-items:center;gap:10px}
.info .hdr h3{margin:0}
.info .ic{flex:0 0 36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;box-shadow:var(--tsh);background:#fff}
.info h3{margin:0 0 6px;font-size:clamp(15px,4.2vw,17px);font-weight:700}
.info p{margin:0;font-size:clamp(16px,4.5vw,18px);line-height:1.7}
.info.def{background:#F6F3FF}
.info.std{background:var(--tip)}
.sheet .head{display:flex;align-items:flex-end;gap:12px;padding-top:18px}
.badh{font-family:var(--fd);font-size:clamp(21px,5.8vw,25px);padding:4px 14px;border-radius:14px;background:var(--bad);color:#4A0F0F;margin:0}
.first{font-family:var(--fd);font-size:24px;background:var(--cur);padding:0 8px;border-radius:8px}
.mini{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--muted)}
.mini .dots{flex:1}
.mini .dot{height:7px}

/* 결과 */
.res-grid{background:#fff;border-radius:18px;padding:10px}
.links{display:flex;flex-direction:column;gap:10px}
.lnk{display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 16px;border-radius:20px;background:#fff;color:var(--ink);text-decoration:none;box-shadow:var(--tsh);transition:transform .08s}
.lnk:active{transform:translateY(2px)}
.lnk .li{flex:0 0 44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff}
.lnk.map .li{background:linear-gradient(160deg,#5BC895,#2E9E6B)}
.lnk.ig .li{background:linear-gradient(45deg,#F9A13A,#E1306C 55%,#833AB4)}
.lnk .lt2{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35}
.lnk b{font-size:clamp(16px,4.4vw,18px)}
.lnk small{font-size:13px;color:var(--muted)}
.lnk .ar{font-size:20px;color:var(--accent)}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.toprow .chip{align-self:center}
.snd{flex:0 0 auto;width:44px;height:44px;border-radius:50%;border:0;background:#fff;box-shadow:var(--tsh);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
.snd[aria-pressed="false"]{background:#EDE9F7;color:#8A84A6}
.bar .t .rt{display:flex;align-items:center;gap:10px}
.bar .snd{width:40px;height:40px}
.qlist{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.qbtn{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:6px 10px;border:0;border-radius:14px;background:#F6F3FF;text-align:left;cursor:pointer;font-size:clamp(15px,4vw,16px)}
.qbtn:hover{background:#EEE8FB}
.qbtn .st{flex:0 0 auto;font-size:13px;font-weight:700;border-radius:999px;padding:1px 9px;background:#fff}
.qbtn .wd{flex:1;min-width:0;font-weight:600}
.qbtn .go{flex:0 0 auto;font-size:13px;font-weight:700;color:var(--accent)}
.qbtn.dn .st{background:var(--okcell);color:var(--ok-ink)}
.qbtn.cu{background:var(--cur)}
.replay{display:flex;flex-direction:column;gap:6px}
.qbtn .wd{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.replay .qbtn{background:#fff}
.replay-h{margin:4px 0 0;font-size:clamp(16px,4.3vw,18px);font-weight:700}
.hintchip{align-self:flex-start;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--cur);color:var(--ink)}
.hintbox{background:#FFF8E1;border-radius:18px;padding:14px 16px;font-size:clamp(16px,4.5vw,18px);line-height:1.65}
.result .duo{padding-top:40px}
.title-name{font-size:clamp(34px,10vw,48px)}
.status{font-size:clamp(14px,4vw,16px);text-align:center;color:var(--muted);min-height:1.4em;margin:0}
.foot{font-size:clamp(13px,3.5vw,14px);color:var(--muted);text-align:center;margin:0}

/* 가로로 눕힌 휴대폰 */
@media (max-height:520px) and (orientation:landscape){
  .ov{align-items:center}
  .sheet{max-width:760px}
  .sheet-body{display:grid;grid-template-columns:minmax(200px,34%) 1fr;column-gap:18px;align-content:start;padding-left:0}
  .sheet-body>*{grid-column:2}
  .sheet-body>.okstage,.sheet-body>.head{grid-column:1;grid-row:1 / span 6;margin:0;align-self:start;flex-direction:column;align-items:center;justify-content:flex-start;padding:30px 14px 16px;position:sticky;top:0;border-radius:0 0 22px 0}
  .sheet-body>.head{background:#FFF0F0}
  .sheet-body>.head .badh{text-align:center}
  .okstage .say{align-items:center;padding:0;text-align:center}
  .okstage .mc{--w:92px}
  .sheet-body>.word{padding-top:14px}
  .mini{display:none}
  .sheet-foot{padding-top:8px;padding-bottom:10px}
  .sheet-foot .cta{min-height:48px;font-size:19px}
  .okstage .bubble{display:none}
  .okbadge{font-size:21px}
  .hero{max-width:900px;grid-template-columns:1fr 1fr;gap:20px}
  .duo .mc{--w:96px !important}
  .bar{position:static}
}
@media (max-width:359px){
  .tile{min-width:42px;min-height:42px;font-size:19px;border-radius:13px}
  .hero{padding:18px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
  .p,.rays,.sweat{display:none}
}
</style>

        '</div>'+
        '<div class="stage">'+
          '<div class="duo"><div class="letters" aria-hidden="true">'+lts+'</div>'+
            '<div class="enter-l">'+mascot('m1','jump',{w:'clamp(108px,32vw,150px)',dur:'2.8s',fx:'spark'})+'</div>'+
            '<div class="enter-d">'+mascot('m2','curious',{w:'clamp(108px,32vw,150px)',dur:'3.4s'})+'</div>'+
          '</div>'+
          '<p class="bubble pop-late"><span class="ph">낱말 조각을 모아</span> <span class="ph">장벽 없는 길을</span> <span class="ph">만들어 줘!</span></p>'+
          '<button class="cta" type="button" data-act="start">같이 가자!</button>'+
          '<p class="meta"><span class="ph">'+WORDS.length+'문제 · 약 5분</span> · <span class="ph">화면낭독기·키보드 지원</span></p>'+
          '<p class="foot">서비스 개선을 위해 익명 방문 통계를 수집합니다.</p>'+
        '</div>'+
        '</section></main>';
    } else if (g.screen==='play') {
      var w=WORDS[g.step], done=solvedCount()+(g.modal==='ok' && !g.solved[g.step]?1:0);
      var slots=w.ans.map(function(_,i){ var j=g.picked[i]; return '<span class="slot'+(j!==undefined?' on':'')+'">'+(j!==undefined?esc(w.tiles[j]):'')+'</span>'; }).join('');
      var tiles=w.tiles.map(function(t,i){ var u=g.picked.indexOf(i)>=0; return '<button class="tile" type="button" data-act="tile" data-i="'+i+'"'+(u||g.modal?' disabled':'')+' aria-label="글자 '+esc(t)+(u?', 사용함':'')+'">'+esc(t)+'</button>'; }).join('');
      h='<div class="bar"><div class="bar-in"><div class="t"><span class="disp">낱말 여행</span><span class="rt"><span>모은 조각 '+done+' / '+WORDS.length+'</span>'+sndBtn()+'</span></div><div class="dots" aria-hidden="true">'+dotsHTML()+'</div></div></div>'+
        '<main class="play">'+
          '<div class="colL">'+
            '<section class="clue rise" aria-labelledby="q"><span class="tag">'+w.dir+' '+w.n+'번 · '+w.ans.length+'글자</span><h2 id="q">'+fmt(w.clue)+'</h2></section>'+
            '<div class="slots" style="--n:'+w.ans.length+'" aria-label="입력한 글자">'+slots+'</div>'+
            '<div class="tiles" role="group" aria-label="글자 조각. 순서대로 눌러 낱말을 만드세요">'+tiles+'</div>'+
            '<div class="row"><button class="ghost" type="button" data-act="undo">한 글자 지우기</button><button class="ghost" type="button" data-act="clear">처음부터</button></div>'+
          '</div>'+
          '<aside class="colR" aria-label="십자말 판과 진행 상황">'+
            '<div class="board"><h3>십자말 판</h3><div role="img" aria-label="십자말풀이 판. '+WORDS.length+'개 중 '+done+'개 완성, 지금 '+w.dir+' '+w.n+'번 칸이 노란색">'+gridHTML(false)+'</div><span class="legend"><span class="ln">노란 칸은 지금 푸는 문제,</span><span class="ln" style="margin-top:0">초록 칸은 맞힌 낱말이에요.</span></span></div>'+
            '<div class="tip">'+mascot(g.step%2?'m1':'m2','idle',{w:'58px'})+'<p>'+(w.dir==='가로'?'<span class="ph">가로 문제는</span> <span class="ph">왼쪽에서 오른쪽으로</span> <span class="ph">읽어요.</span>':'<span class="ph">세로 문제는</span> <span class="ph">위에서 아래로</span> <span class="ph">읽어요.</span>')+'</p></div>'+
            '<details class="list"><summary>문제 목록 · 골라서 풀기</summary><div class="qlist">'+qButtons()+'</div></details>'+
          '</aside>'+
        '</main>';
      if (g.modal==='ok') {
        var G=GESTURES[g.step % GESTURES.length], who=g.step%2?'m2':'m1';
        var ans=w.ans.map(function(ch,i){ return '<span style="--i:'+i+'">'+esc(ch)+'</span>'; }).join('');
        h+='<div class="ov"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mh" aria-describedby="md">'+
          '<div class="sheet-body">'+
            '<div class="okstage"><span class="cnt">'+(g.step+1)+' / '+WORDS.length+'</span>'+
              mascot(who,G.g,{fx:G.fx})+
              '<div class="say"><h2 class="okbadge" id="mh"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>정답!</h2><p class="bubble">'+esc(G.say)+'</p></div>'+
            '</div>'+
            '<div class="word"><span class="dirl">'+w.dir+' '+w.n+'번 낱말</span><div class="ans" style="--n:'+w.ans.length+'" aria-label="정답 '+esc(w.w)+'">'+ans+'</div></div>'+
            '<div class="termrow"><span class="term">'+esc(w.term)+'</span></div>'+
            '<section class="info def" id="md"><div class="hdr"><span class="ic">'+ICON_BOOK+'</span><h3>낱말 풀이</h3></div><p>'+fmt(w.def)+'</p></section>'+
            '<section class="info std"><div class="hdr"><span class="ic">'+ICON_BULB+'</span><h3>알아두면 좋아요</h3></div><p>'+fmt(w.std)+'</p></section>'+
          '</div>'+
          '<div class="sheet-foot"><div class="mini"><span>모은 조각</span><span class="dots" aria-hidden="true">'+dotsHTML()+'</span><span>'+done+'/'+WORDS.length+'</span></div>'+
            '<button class="cta" type="button" data-act="next">'+(done>=WORDS.length?'결과 보기':'다음 문제')+'</button>'+
            '<div class="row"><button class="ghost" type="button" data-act="retry">이 문제 다시 풀기</button></div></div>'+
          '</div></div>';
      } else if (g.modal==='bad') {
        var hint = '<span class="ln">'+hintFor(w, g.tries)+'</span>';
        h+='<div class="ov"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mh">'+
          '<div class="sheet-body"><div class="head">'+mascot('m2','no',{w:'clamp(80px,22vw,96px)'})+'<h2 class="badh" id="mh">앗, 아직 장벽이 남았어요</h2></div>'+
          '<span class="hintchip">힌트 '+g.tries+'</span><p class="hintbox" style="margin:0">'+hint+'</p><p style="margin:0;color:var(--muted)">글자 조각을 다시 골라 볼까요?</p></div>'+
          '<div class="sheet-foot"><button class="cta" type="button" data-act="clear">다시 도전하기</button>'+
          (g.tries>=3?'<div class="row"><button class="ghost" type="button" data-act="reveal">정답 보고 넘어가기</button></div>':'')+
          '</div></div></div>';
      }
    } else {
      var b=badge();
      h='<main class="center"><section class="hero result rise" aria-labelledby="t">'+
        '<div class="hero-text">'+
          '<div class="toprow"><span class="chip">낱말 조각 '+WORDS.length+'개 완성!</span>'+sndBtn()+'</div>'+
          '<div class="duo">'+mascot('m1','finale',{w:'clamp(100px,28vw,140px)',fx:'confetti'})+mascot('m2','bounce',{w:'clamp(100px,28vw,140px)',fx:'star',dur:'2.2s'})+'</div>'+
          '<div><p style="font-size:clamp(15px,4vw,17px);font-weight:600;margin:0">나의 칭호</p><h1 class="disp title-name" id="t">'+b[0]+'</h1></div>'+
          '<p class="lead" style="font-size:clamp(16px,4.5vw,19px)">'+fmt(b[1])+'</p>'+
        '</div>'+
        '<div class="hero-text">'+
          '<div class="res-grid" role="img" aria-label="완성된 십자말풀이 판">'+gridHTML(true)+'</div>'+
          '<button class="cta" type="button" data-act="share">친구에게 링크 보내기</button>'+
          '<p class="status" id="st" role="status"></p>'+
          '<div class="links">'+
            '<a class="lnk map" href="https://naeilmap.com" target="_blank" rel="noopener"><span class="li">'+ICON_MAP+'</span><span class="lt2"><b>광주 무장애지도 보러가기</b><small>내일맵 · naeilmap.com</small></span><span class="ar" aria-hidden="true">→</span></a>'+
            '<a class="lnk ig" href="https://www.instagram.com/naeil__official/" target="_blank" rel="noopener"><span class="li">'+ICON_IG+'</span><span class="lt2"><b>모두의 내일 인스타그램</b><small>@naeil__official</small></span><span class="ar" aria-hidden="true">→</span></a>'+
          '</div>'+
          '<h2 class="replay-h">문제별 다시 풀기</h2><div class="replay">'+qButtons()+'</div>'+
          '<div class="row"><button class="ghost" type="button" data-act="restart">처음부터 다시 하기</button></div>'+
          '<p class="foot"><span class="ph">인권잡지 「다다름」</span> × <span class="ph">광산구장애인복지관</span> × <span class="ph">모두의 내일</span></p>'+
          '<p class="foot">서비스 개선을 위해 익명 방문 통계를 수집합니다.</p>'+
        '</div>'+
        '</section></main>';
    }
    $app.innerHTML=h;
    var f=$app.querySelector('.sheet .cta'); if (f) f.focus({preventScroll:true});
  }

  function focusTop(){ var t=$app.querySelector('h1,h2'); if(t){ t.setAttribute('tabindex','-1'); t.focus({preventScroll:true}); } window.scrollTo(0,0); }

  $app.addEventListener('click', function(e){
    var lk=e.target.closest('a.lnk'); if (lk) { track('outbound_click', { link_name: lk.classList.contains('map') ? 'naeilmap' : 'instagram', link_url: lk.href }); return; }
    var t=e.target.closest('[data-act]'); if(!t) return;
    var act=t.getAttribute('data-act'), w=WORDS[g.step];
    if (act==='sound') { SOUND=!SOUND; try { localStorage.setItem('dadareum-sound', SOUND?'on':'off'); } catch(err) {} if (SOUND) play('tap'); t.outerHTML=sndBtn(); var nb2=$app.querySelector('[data-act=sound]'); if(nb2) nb2.focus({preventScroll:true}); return; }
    if (act==='start') { g=fresh('play'); play('start'); track('crossword_start'); render(); focusTop(); return; }
    if (act==='goto') { track('question_replay', { question: WORDS[+t.getAttribute('data-i')].dir+' '+WORDS[+t.getAttribute('data-i')].n }); g.step=+t.getAttribute('data-i'); g.screen='play'; g.picked=[]; g.modal=null; g.tries=0; play('step'); render(); focusTop(); return; }
    if (act==='retry') { g.solved[g.step]=true; g.picked=[]; g.modal=null; g.tries=0; play('step'); render(); focusTop(); return; }
    if (act==='tile') {
      var i=+t.getAttribute('data-i');
      if (g.modal || g.picked.indexOf(i)>=0) return;
      g.picked=g.picked.concat([i]);
      $live.textContent=w.tiles[i]+' 입력, '+g.picked.length+'/'+w.ans.length+'글자';
      if (g.picked.length===w.ans.length) {
        var ok=g.picked.map(function(j){return w.tiles[j];}).join('')===w.w;
        if (ok) { g.modal='ok'; play('correct'); track('answer_correct', { question: w.dir+' '+w.n, wrong_count: g.tries, revealed: false }); } else { g.modal='bad'; g.wrong++; g.tries++; play('wrong'); track('hint_shown', { question: w.dir+' '+w.n, hint_step: g.tries }); }
      } else play('tap');
      render();
      if (!g.modal) { var nb=$app.querySelector('.tile:not([disabled])'); if(nb) nb.focus({preventScroll:true}); }
      return;
    }
    if (act==='undo') { if(!g.modal && g.picked.length){ g.picked=g.picked.slice(0,-1); play('undo'); } render(); var u=$app.querySelector('[data-act="undo"]'); if(u) u.focus({preventScroll:true}); return; }
    if (act==='clear') { g.picked=[]; g.modal=null; render(); var ft=$app.querySelector('.tile'); if(ft) ft.focus({preventScroll:true}); return; }
    if (act==='reveal') {
      var used={}; g.picked=w.ans.map(function(ch){ for(var j=0;j<w.tiles.length;j++){ if(w.tiles[j]===ch && !used[j]){ used[j]=1; return j; } } return 0; });
      g.revealed++; g.modal='ok'; play('correct'); track('answer_correct', { question: w.dir+' '+w.n, wrong_count: g.tries, revealed: true }); render(); return;
    }
    if (act==='next') {
      g.solved[g.step]=true;
      var nx=nextUnsolved(g.step);
      if (nx<0) { g.screen='result'; play('fanfare'); if (!COMPLETED) { COMPLETED = true; track('crossword_complete', { badge: badge()[0], wrong_count: g.wrong, revealed_count: g.revealed }); } } else { g.step=nx; play('step'); }
      g.picked=[]; g.modal=null; g.tries=0; render(); focusTop(); return;
    }
    if (act==='restart') { g=fresh('start'); render(); focusTop(); return; }
    if (act==='share') {
      track('share_click');
      var st=document.getElementById('st'), msg='말랑말랑 배리어프리 낱말 여행 — 같이 풀어 봐요! '+SHARE_URL;
      var fail=function(){ st.textContent='복사가 안 되면 이 주소를 보내 주세요: '+SHARE_URL; };
      try { navigator.clipboard.writeText(msg).then(function(){ st.textContent='링크를 복사했어요. 카톡이나 문자에 붙여 넣어 보내 주세요.'; }, fail); } catch(err){ fail(); }
    }
  });

  document.addEventListener('keydown', function(e){
    if (g.screen!=='play') return;
    if (e.key==='Backspace' && !g.modal && g.picked.length) { e.preventDefault(); g.picked=g.picked.slice(0,-1); play('undo'); render(); }
    if (e.key==='Enter' && g.modal==='ok' && document.activeElement===document.body) { e.preventDefault(); $app.querySelector('[data-act=next]').click(); }
  });

  render();
})();
</script>
</body>
</html>
